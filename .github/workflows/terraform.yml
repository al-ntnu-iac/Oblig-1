
name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      action:
        description: "Plan only or apply changes"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    if: ${{ inputs.environment == 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure account
        run: az account show --query "{name:name, userType:user.type}" -o table

      - name: Terraform Init - Network
        working-directory: stacks/network
        run: |
          terraform init -input=false \
            -backend-config="../../shared/backend.hcl" \
            -backend-config="key=${{ inputs.environment }}/network.tfstate"

      - name: Terraform Plan - Network
        working-directory: stacks/network
        env:
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_address_space: "10.10.0.0/16"
        run: terraform plan -input=false -no-color -out=network.tfplan

      - name: Terraform Apply - Network
        if: ${{ inputs.action == 'apply' }}
        working-directory: stacks/network
        env:
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_address_space: "10.10.0.0/16"
        run: terraform apply -input=false -no-color network.tfplan
